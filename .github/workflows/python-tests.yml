name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: osf-buildable-checkpoint-20077/pyproject.toml

      - name: Install package
        working-directory: osf-buildable-checkpoint-20077
        run: python -m pip install .

      - name: Run tests
        working-directory: osf-buildable-checkpoint-20077
        run: python -m unittest discover -s tests -v
