[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-software-factory"
version = "0.1.0"
description = "One-time production pipeline for build-ready software project specifications"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0"]

[project.scripts]
osf = "osf_factory.cli:main"

[tool.setuptools.packages.find]
include = ["osf_factory*"]
